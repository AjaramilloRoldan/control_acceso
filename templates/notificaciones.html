<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notificaciones - Control Acceso</title>
    <link rel="icon" href="/static/pestana.png" />
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.10/tailwindcss.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-200 min-h-screen">
    <header
      class="border-b border-white/5 px-6 py-6 flex items-center justify-between gap-4"
    >
      <h1 class="text-2xl font-bold text-white tracking-tight">
        Notificaciones
      </h1>
      <a
        href="/instalaciones"
        class="px-6 py-2 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-sm font-bold text-emerald-400"
        >Volver a instalaciones</a
      >
    </header>

    <main class="max-w-3xl mx-auto p-6 md:p-10">
      {% if pendientes %}
      <form
        method="post"
        action="/notificaciones/leidas"
        class="mb-6 text-right"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <button
          type="submit"
          class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-bold text-white"
        >
          Marcar todas como leídas
        </button>
      </form>
      {% endif %}

      <ul class="space-y-3">
        {% for notificacion in notificaciones %}
        <li
          class="p-4 rounded-2xl border {{ 'bg-slate-900/20 border-white/5 text-slate-400' if notificacion.leida else 'bg-emerald-500/5 border-emerald-500/20 text-white' }}"
        >
          <p class="text-sm">{{ notificacion.mensaje }}</p>
          <p class="text-xs text-slate-500 mt-1">
            {{ notificacion.creado_en.strftime('%Y-%m-%d %H:%M') }}
          </p>
        </li>
        {% else %}
        <li class="p-8 text-center text-slate-500">
          No tienes notificaciones.
        </li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
